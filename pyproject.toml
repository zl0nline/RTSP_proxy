[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtsp-proxy"
version = "0.1.0"
description = "Control plane for a transparent RTSP-over-TCP proxy"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
rtsp-proxy-verify-release = "rtsp_proxy.cli:main"

[dependency-groups]
dev = [
  "httpx2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rtsp_proxy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "contract: black-box contract against pinned external binaries",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rtsp_proxy"]
