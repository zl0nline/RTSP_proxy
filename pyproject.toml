[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "rtsp-proxy"
version = "0.1.0"
description = "Control plane for a transparent RTSP-over-TCP proxy"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
rtsp-proxy-verify-release = "rtsp_proxy.cli:main"
rtsp-proxy-web = "rtsp_proxy.runtime:run_web"
rtsp-proxy-role = "rtsp_proxy.runtime:run_background"
rtsp-proxy-load = "rtsp_proxy.load_cli:main"
rtsp-proxy-migrate = "rtsp_proxy.migrate:run_migrations"
rtsp-proxy-node-helper = "rtsp_proxy.node_runtime:run_node_runtime_helper"

[dependency-groups]
dev = [
  "httpx2",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rtsp_proxy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "contract: black-box contract against pinned external binaries",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rtsp_proxy"]

[tool.coverage.run]
omit = ["src/rtsp_proxy/migrations/*"]
