name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install native PostgreSQL test server
        run: |
          sudo rm -f /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d -mindepth 1 -maxdepth 1 \
            -type f -delete
          sudo tee /etc/apt/sources.list.d/rtsp-proxy-snapshot.sources \
            >/dev/null <<'EOF'
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/20260829T120000Z/
          Suites: noble noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get -o Acquire::Retries=10 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=10 -o Acquire::https::Timeout=30 \
            install --yes --allow-downgrades --no-install-recommends \
            clang-18=1:18.1.3-1ubuntu1 \
            libbpf-dev=1:1.3.0-2build2 \
            libelf-dev=0.190-1.1ubuntu0.1 \
            linux-libc-dev=6.8.0-138.138 \
            linux-tools-generic=6.8.0-138.138 \
            postgresql
          test "$(dpkg-query --show --showformat='${Version}' clang-18)" = \
            '1:18.1.3-1ubuntu1'
          test "$(dpkg-query --show --showformat='${Version}' libbpf-dev)" = \
            '1:1.3.0-2build2'
          test "$(dpkg-query --show --showformat='${Version}' libelf-dev)" = \
            '0.190-1.1ubuntu0.1'
          test "$(dpkg-query --show --showformat='${Version}' linux-libc-dev)" = \
            '6.8.0-138.138'
          test "$(dpkg-query --show --showformat='${Version}' linux-tools-generic)" = \
            '6.8.0-138.138'
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Test with coverage
        run: |
          uv run pytest --cov=rtsp_proxy --cov-report=term-missing
          uv run coverage report --precision=2 --fail-under=90

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy

      - name: Build release artifacts
        run: uv build

      - name: Export locked runtime requirements and SBOM
        run: |
          mkdir -p .artifacts
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file .artifacts/runtime-requirements.txt
          uv export --locked --no-dev --format cyclonedx1.5 --output-file .artifacts/sbom.cdx.json
          test -s .artifacts/runtime-requirements.txt
          test -s .artifacts/sbom.cdx.json

      - name: Audit locked dependencies
        run: uv run pip-audit --local --skip-editable

      - name: Verify clean wheel installation
        run: |
          uv venv --python 3.12 .artifacts/clean-venv
          uv pip sync --python .artifacts/clean-venv/bin/python .artifacts/runtime-requirements.txt
          uv pip install --python .artifacts/clean-venv/bin/python --no-deps dist/rtsp_proxy-0.1.0-py3-none-any.whl
          RTSP_PROXY_ROLE=web .artifacts/clean-venv/bin/python -c 'from rtsp_proxy.runtime import create_app_from_environment; assert create_app_from_environment().title == "RTSP Proxy Control Plane"'
          .artifacts/clean-venv/bin/python -c 'from rtsp_proxy.probe_connect_guard import _load_packaged_artifact_catalog; catalog = _load_packaged_artifact_catalog(); assert catalog.current_release_id == "0.1.0"'
          .artifacts/clean-venv/bin/python -c 'from rtsp_proxy.release import trusted_probe_ffprobe_identity; amd64 = trusted_probe_ffprobe_identity("amd64"); arm64 = trusted_probe_ffprobe_identity("arm64"); assert amd64[0] == arm64[0] == "9b6c896-rtsp-proxy.1"; assert amd64[1] != arm64[1]'
          .artifacts/clean-venv/bin/python -c 'from rtsp_proxy.release import trusted_probe_connect_guard_identity; amd64 = trusted_probe_connect_guard_identity("amd64"); arm64 = trusted_probe_connect_guard_identity("arm64"); assert amd64[0] == arm64[0] == "0.1.0"; assert amd64[1] == arm64[1]'
          launcher_stdout=$(mktemp)
          launcher_stderr=$(mktemp)
          if .artifacts/clean-venv/bin/rtsp-proxy-probe-launcher \
              </dev/null >"$launcher_stdout" 2>"$launcher_stderr"; then
            echo "probe launcher unexpectedly accepted EOF input" >&2
            exit 1
          else
            launcher_status=$?
          fi
          test "$launcher_status" -eq 70
          test ! -s "$launcher_stdout"
          test ! -s "$launcher_stderr"
          broker_stdout=$(mktemp)
          broker_stderr=$(mktemp)
          if .artifacts/clean-venv/bin/rtsp-proxy-probe-broker \
              </dev/null >"$broker_stdout" 2>"$broker_stderr"; then
            echo "probe broker unexpectedly started without root" >&2
            exit 1
          else
            broker_status=$?
          fi
          test "$broker_status" -eq 1
          test ! -s "$broker_stdout"
          test "$(cat "$broker_stderr")" = "probe_broker_linux_root_required"

      - name: Verify packaged migrations against native PostgreSQL
        run: |
          migration_pgdata=$(mktemp -d)
          migration_socket=$(mktemp -d)
          migration_port=$(.artifacts/clean-venv/bin/python -c 'import socket; listener=socket.socket(); listener.bind(("127.0.0.1", 0)); print(listener.getsockname()[1]); listener.close()')
          initdb --pgdata "$migration_pgdata" --username postgres --auth-local trust --auth-host trust --no-locale --encoding UTF8
          pg_ctl --pgdata "$migration_pgdata" --options "-h 127.0.0.1 -p $migration_port -k $migration_socket" --log "$migration_pgdata/server.log" start
          trap 'pg_ctl --pgdata "$migration_pgdata" --mode fast stop' EXIT
          createdb --host 127.0.0.1 --port "$migration_port" --username postgres rtsp_proxy_migration_test
          RTSP_PROXY_DATABASE_URL="postgresql+psycopg://postgres@127.0.0.1:$migration_port/rtsp_proxy_migration_test" \
            .artifacts/clean-venv/bin/rtsp-proxy-migrate
          test "$(psql --host 127.0.0.1 --port "$migration_port" --username postgres --dbname rtsp_proxy_migration_test --tuples-only --no-align --command 'SELECT version_num FROM alembic_version')" = "0023_probe_health_states"
          RTSP_PROXY_DATABASE_URL="postgresql+psycopg://postgres@127.0.0.1:$migration_port/rtsp_proxy_migration_test" \
            .artifacts/clean-venv/bin/python -c 'import os; from rtsp_proxy.database import PostgresNodeStore; store = PostgresNodeStore(os.environ["RTSP_PROXY_DATABASE_URL"]); store.assert_camera_catalog_ready(); store.close()'

      - name: Validate systemd units
        run: |
          sudo install -d /opt/rtsp-proxy/releases/ci/.venv/bin /opt/rtsp-proxy/releases/ci/bin
          sudo install -d /etc/rtsp-proxy/control-plane /etc/rtsp-proxy/mediamtx
          sudo install -d -m 0700 /etc/rtsp-proxy/nodes
          sudo install -d /var/lib/rtsp-proxy/nodes /var/log/rtsp-proxy/nodes
          sudo install -m 0755 /usr/bin/true /opt/rtsp-proxy/releases/ci/.venv/bin/rtsp-proxy-web
          sudo install -m 0755 /usr/bin/true /opt/rtsp-proxy/releases/ci/.venv/bin/rtsp-proxy-auth
          sudo install -m 0755 /usr/bin/true /opt/rtsp-proxy/releases/ci/.venv/bin/rtsp-proxy-role
          sudo install -m 0755 /usr/bin/true /opt/rtsp-proxy/releases/ci/.venv/bin/rtsp-proxy-node-helper
          sudo install -m 0755 /usr/bin/true /opt/rtsp-proxy/releases/ci/.venv/bin/rtsp-proxy-nft-reconcile
          sudo install -m 0755 tests/fixtures/probe_systemd_launcher.py \
            /opt/rtsp-proxy/releases/ci/.venv/bin/rtsp-proxy-probe-launcher
          sudo install -m 0755 /usr/bin/true \
            /opt/rtsp-proxy/releases/ci/.venv/bin/rtsp-proxy-probe-broker
          sudo install -m 0755 /usr/bin/true /opt/rtsp-proxy/releases/ci/bin/mediamtx
          sudo ln -s releases/ci /opt/rtsp-proxy/current
          sudo touch /etc/rtsp-proxy/control-plane/rtsp-proxy.env
          sudo touch /etc/rtsp-proxy/control-plane/access-peppers.json
          sudo mkdir -p /etc/rtsp-proxy/control-plane/management-tls.initial
          sudo touch /etc/rtsp-proxy/control-plane/management-tls.initial/management-tls.pem
          sudo ln -sfn management-tls.initial \
            /etc/rtsp-proxy/control-plane/management-tls-current
          sudo touch /etc/rtsp-proxy/control-plane/rtsp-proxy-worker.env
          sudo touch /etc/rtsp-proxy/collector.env
          sudo touch /etc/rtsp-proxy/notifier.env
          sudo touch /etc/rtsp-proxy/control-plane/smtp-password
          sudo touch /etc/rtsp-proxy/mediamtx/mediamtx.yml
          sudo touch /etc/rtsp-proxy/node-runtime.env
          systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.socket
          service_uid="$(id -u)"
          sudo env \
            RTSP_PROXY_RUN_SYSTEMD_HTTPS_CONTRACT=1 \
            RTSP_PROXY_SYSTEMD_SERVICE_UID="$service_uid" \
            PYTHONPATH="$PWD/src" \
            "$PWD/.venv/bin/python" -m pytest -q \
            tests/contract/test_management_https_systemd.py

      - name: Validate owned nftables policy
        run: |
          sudo apt-get -o Acquire::Retries=10 -o Acquire::https::Timeout=30 \
            install --yes --no-install-recommends nftables
          sudo nft --check --file deploy/nftables/rtsp-proxy.nft
          sudo install -d -m 0700 /run/rtsp-proxy-nftables
          sudo install -d -m 0755 /etc/rtsp-proxy
          sudo install -o root -g root -m 0644 \
            deploy/nftables/rtsp-proxy.nft /etc/rtsp-proxy/rtsp-proxy.nft
          sudo .venv/bin/rtsp-proxy-nft-reconcile \
            --policy /etc/rtsp-proxy/rtsp-proxy.nft
          sudo .venv/bin/rtsp-proxy-nft-reconcile \
            --policy /etc/rtsp-proxy/rtsp-proxy.nft
          sudo nft --json list table inet rtsp_proxy | \
            jq --exit-status '.nftables[] | select(.table.comment == "rtsp-proxy-owned:v1")'
          sudo nft delete table inet rtsp_proxy

      - name: Verify direct transient probe policy
        run: |
          sudo env \
            PYTHONPATH="$PWD/src" \
            RTSP_PROXY_RUN_PROBE_SYSTEMD_CONTRACT=1 \
            "$PWD/.venv/bin/python" -m pytest -q -p no:cacheprovider \
            tests/contract/test_probe_systemd.py

      - name: Verify exact cgroup probe connect guard
        run: |
          mounted_bpffs=0
          if ! mountpoint --quiet /sys/fs/bpf; then
            sudo mount --type bpf bpffs /sys/fs/bpf
            mounted_bpffs=1
          fi
          cleanup_bpffs() {
            if [[ "$mounted_bpffs" == 1 ]]; then
              sudo umount /sys/fs/bpf
            fi
          }
          trap cleanup_bpffs EXIT
          bpftool_path=/usr/lib/linux-tools-6.8.0-138/bpftool
          test -x "$bpftool_path"
          "$bpftool_path" version
          mkdir -p .artifacts/probe
          RTSP_PROXY_PROBE_CLANG=/usr/bin/clang-18 \
            tools/probe/build_connect_guard.sh \
            "$PWD/.artifacts/probe/rtsp_probe_connect_guard.bpf.o"
          sha256sum \
            "$bpftool_path" \
            "$PWD/.artifacts/probe/rtsp_probe_connect_guard.bpf.o"
          sudo env \
            PYTHONPATH="$PWD/src" \
            RTSP_PROXY_RUN_PROBE_BPF_CONTRACT=1 \
            RTSP_PROXY_PRINT_PROBE_GUARD_IDENTITY=1 \
            RTSP_PROXY_BPFTOOL="$bpftool_path" \
            RTSP_PROXY_PROBE_GUARD_BPF_OBJECT="$PWD/.artifacts/probe/rtsp_probe_connect_guard.bpf.o" \
            "$PWD/.venv/bin/python" -m pytest -q -s -p no:cacheprovider \
            tests/contract/test_probe_connect_guard.py

      - name: Upload verified probe connect-guard object
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: probe-connect-guard-${{ matrix.arch }}
          path: .artifacts/probe/rtsp_probe_connect_guard.bpf.o
          if-no-files-found: error

  probe-ffprobe-contract:
    name: probe-ffprobe-contract (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Snapshot package installation can take seven minutes before native arm64
    # compilation starts. Keep room for the contracts; their own deadlines stay fixed.
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups

      - name: Install pinned probe ffprobe build environment
        run: |
          snapshot=$(jq --raw-output \
            '.probe_ffprobe.build_environment.ubuntu_snapshot' \
            deploy/artifact-catalog.json)
          sudo rm -f /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d -mindepth 1 -maxdepth 1 \
            -type f -delete
          sudo tee /etc/apt/sources.list.d/rtsp-proxy-snapshot.sources \
            >/dev/null <<EOF
          Types: deb
          URIs: ${snapshot}
          Suites: noble noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get -o Acquire::Retries=10 -o Acquire::https::Timeout=30 update
          mapfile -t pinned_packages < <(
            jq --raw-output \
              '.probe_ffprobe.build_environment.packages | to_entries[] | .key + "=" + .value' \
              deploy/artifact-catalog.json
          )
          sudo apt-get -o Acquire::Retries=10 -o Acquire::https::Timeout=30 \
            install --yes --allow-downgrades --no-install-recommends \
            "${pinned_packages[@]}"

      - name: Build controlled no-redirect ffprobe (${{ matrix.arch }})
        run: |
          test "$(gcc -dumpfullversion | awk -F. '{print $1}')" = \
            "$(jq --raw-output '.probe_ffprobe.compiler_major' deploy/artifact-catalog.json)"
          mkdir -p .artifacts/probe-ffprobe
          tools/build_probe_ffprobe.sh \
            "${{ matrix.arch }}" \
            .artifacts/probe-ffprobe/ffprobe
          tools/build_probe_ffprobe.sh \
            "${{ matrix.arch }}" \
            .artifacts/probe-ffprobe/ffprobe.repeat
          cmp --silent \
            .artifacts/probe-ffprobe/ffprobe \
            .artifacts/probe-ffprobe/ffprobe.repeat
          rm -- .artifacts/probe-ffprobe/ffprobe.repeat

      - name: Verify controlled RTSP redirect refusal
        env:
          PROBE_FFPROBE_BINARY: .artifacts/probe-ffprobe/ffprobe
        run: uv run pytest -q tests/contract/test_probe_ffprobe.py

      - name: Upload controlled probe ffprobe candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: probe-ffprobe-${{ matrix.arch }}
          path: .artifacts/probe-ffprobe/ffprobe*
          if-no-files-found: error

  browser-e2e:
    # This is an external Chromium-client gate. agent-browser does not publish
    # a Linux arm64 Chromium bundle; the server-side templates, OIDC/session,
    # CSRF and logout contracts remain in the test job on both architectures.
    name: browser-e2e (external client, amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups

      - name: Install pinned browser driver and Chromium
        run: |
          npm install --global agent-browser@0.26.0
          test "$(agent-browser --version)" = "agent-browser 0.26.0"
          agent-browser install

      - name: Verify dashboard in a real browser
        env:
          RTSP_PROXY_RUN_BROWSER_E2E: "1"
          RTSP_PROXY_BROWSER_ARTIFACT_DIR: .artifacts/browser-e2e
          # GitHub's disposable Ubuntu runner blocks Chromium user namespaces.
          RTSP_PROXY_BROWSER_NO_SANDBOX: "1"
        run: uv run pytest -q tests/browser/test_dashboard_browser.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dashboard-browser-e2e-amd64
          path: .artifacts/browser-e2e
          if-no-files-found: error

  media-binaries-contract:
    name: media-binaries-contract (${{ matrix.arch }})
    needs: [test, probe-ffprobe-contract]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Install pinned probe-broker host tool
        run: |
          sudo rm -f /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d -mindepth 1 -maxdepth 1 \
            -type f -delete
          sudo tee /etc/apt/sources.list.d/rtsp-proxy-snapshot.sources \
            >/dev/null <<'EOF'
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/20260829T120000Z/
          Suites: noble noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get -o Acquire::Retries=10 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=10 -o Acquire::https::Timeout=30 \
            install --yes --allow-downgrades --no-install-recommends \
            linux-tools-generic=6.8.0-138.138
          test "$(dpkg-query --show --showformat='${Version}' linux-tools-generic)" = \
            '6.8.0-138.138'
          test -x /usr/lib/linux-tools-6.8.0-138/bpftool

      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: false

      - name: Download controlled probe ffprobe (${{ matrix.arch }})
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: probe-ffprobe-${{ matrix.arch }}
          path: .artifacts/probe-ffprobe

      - name: Download verified probe connect guard (${{ matrix.arch }})
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: probe-connect-guard-${{ matrix.arch }}
          path: .artifacts/probe-connect-guard

      - name: Build pinned patched MediaMTX (${{ matrix.arch }})
        run: |
          mkdir -p .artifacts/mediamtx
          tools/build_mediamtx.sh "${{ matrix.arch }}" .artifacts/mediamtx/mediamtx

      - name: Download and verify FFmpeg/ffprobe (${{ matrix.arch }})
        run: |
          archive_url=$(jq --raw-output --arg arch "${{ matrix.arch }}" '.ffmpeg.architectures[$arch].archive_url' deploy/artifact-catalog.json)
          archive_sha256=$(jq --raw-output --arg arch "${{ matrix.arch }}" '.ffmpeg.architectures[$arch].archive_sha256' deploy/artifact-catalog.json)
          ffmpeg_sha256=$(jq --raw-output --arg arch "${{ matrix.arch }}" '.ffmpeg.architectures[$arch].ffmpeg_sha256' deploy/artifact-catalog.json)
          ffprobe_sha256=$(jq --raw-output --arg arch "${{ matrix.arch }}" '.ffmpeg.architectures[$arch].ffprobe_sha256' deploy/artifact-catalog.json)
          mkdir -p .artifacts/ffmpeg
          curl --fail --location --silent --show-error \
            --output .artifacts/ffmpeg.tar.xz \
            "$archive_url"
          echo "$archive_sha256  .artifacts/ffmpeg.tar.xz" | sha256sum --check
          tar -xJf .artifacts/ffmpeg.tar.xz -C .artifacts/ffmpeg --strip-components=1
          echo "$ffmpeg_sha256  .artifacts/ffmpeg/bin/ffmpeg" | sha256sum --check
          echo "$ffprobe_sha256  .artifacts/ffmpeg/bin/ffprobe" | sha256sum --check

          expected_version=$(jq --raw-output '.ffmpeg.version' deploy/artifact-catalog.json)
          test "$(.artifacts/ffmpeg/bin/ffmpeg -version | awk 'NR == 1 {print $3}')" = "$expected_version"
          test "$(.artifacts/ffmpeg/bin/ffprobe -version | awk 'NR == 1 {print $3}')" = "$expected_version"

      - name: Verify native release manifest end to end
        run: |
          uv build
          mkdir -p \
            .artifacts/release/bin \
            .artifacts/release/dist \
            .artifacts/release/libexec/rtsp-proxy-probe
          install -m 0755 .artifacts/mediamtx/mediamtx .artifacts/release/bin/mediamtx
          install -m 0755 .artifacts/ffmpeg/bin/ffmpeg .artifacts/release/bin/ffmpeg
          install -m 0755 .artifacts/ffmpeg/bin/ffprobe .artifacts/release/bin/ffprobe
          install -m 0755 \
            .artifacts/probe-ffprobe/ffprobe \
            .artifacts/release/libexec/rtsp-proxy-probe/ffprobe
          install -m 0644 \
            .artifacts/probe-connect-guard/rtsp_probe_connect_guard.bpf.o \
            .artifacts/release/libexec/rtsp-proxy-probe/rtsp_probe_connect_guard.bpf.o
          install -m 0644 uv.lock .artifacts/release/uv.lock
          install -m 0644 dist/rtsp_proxy-0.1.0-py3-none-any.whl .artifacts/release/dist/
          lock_sha256=$(sha256sum .artifacts/release/uv.lock | awk '{print $1}')
          wheel_sha256=$(sha256sum .artifacts/release/dist/rtsp_proxy-0.1.0-py3-none-any.whl | awk '{print $1}')
          git_commit=$(git rev-parse HEAD)
          jq \
            --arg lock_sha256 "$lock_sha256" \
            --arg wheel_sha256 "$wheel_sha256" \
            --arg git_commit "$git_commit" \
            '.python.lock_sha256 = $lock_sha256
             | .python.wheel_sha256 = $wheel_sha256
             | .git_commit = $git_commit' \
            "deploy/release-manifest.${{ matrix.arch }}.example.json" \
            > .artifacts/release/release-manifest.json
          uv export \
            --locked \
            --no-dev \
            --no-emit-project \
            --format requirements.txt \
            --output-file .artifacts/release-requirements.txt
          uv venv --python 3.12 .artifacts/release-venv
          uv pip sync \
            --python .artifacts/release-venv/bin/python \
            .artifacts/release-requirements.txt
          uv pip install \
            --python .artifacts/release-venv/bin/python \
            --no-deps \
            dist/rtsp_proxy-0.1.0-py3-none-any.whl
          .artifacts/release-venv/bin/rtsp-proxy-verify-release \
            --manifest .artifacts/release/release-manifest.json

      - name: Publish verified pilot release bundle (${{ matrix.arch }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rtsp-proxy-release-${{ matrix.arch }}
          path: .artifacts/release
          if-no-files-found: error
          retention-days: 14

      - name: Verify installed root broker transaction
        run: |
          broker_release=/opt/rtsp-proxy/releases/probe-contract
          broker_uv=$(command -v uv)
          broker_python=$(uv python find 3.12)
          broker_bpftool=/usr/lib/linux-tools-6.8.0-138/bpftool
          mounted_bpffs=0
          cleanup_broker() {
            sudo systemctl stop rtsp-proxy-probe-broker.socket \
              rtsp-proxy-probe-broker.service || true
            sudo rm -f \
              /run/systemd/system/rtsp-proxy-probe-broker.socket \
              /run/systemd/system/rtsp-proxy-probe-broker.service \
              /etc/rtsp-proxy/probe-broker.env \
              /opt/rtsp-proxy/current
            sudo rm -rf \
              /run/rtsp-proxy-probe-contract \
              /opt/rtsp-proxy/releases/probe-contract \
              /opt/rtsp-proxy/releases/probe-malformed-result \
              /opt/rtsp-proxy/releases/probe-output-flood \
              /sys/fs/bpf/rtsp-proxy-probe-broker
            sudo systemctl daemon-reload
            if [[ "$mounted_bpffs" == 1 ]]; then
              sudo umount /sys/fs/bpf
            fi
          }
          trap cleanup_broker EXIT
          if ! mountpoint --quiet /sys/fs/bpf; then
            sudo mount --type bpf bpffs /sys/fs/bpf
            mounted_bpffs=1
          fi
          if ! getent group rtsp-proxy >/dev/null; then
            sudo groupadd --system rtsp-proxy
          fi
          if ! getent passwd rtsp-proxy >/dev/null; then
            sudo useradd --system --gid rtsp-proxy --no-create-home \
              --shell /usr/sbin/nologin rtsp-proxy
          fi
          sudo install -d -o root -g root -m 0755 \
            /opt/rtsp-proxy/releases "$broker_release"
          sudo cp -a .artifacts/release/. "$broker_release/"
          sudo "$broker_uv" venv --python "$broker_python" "$broker_release/.venv"
          sudo "$broker_uv" pip sync \
            --python "$broker_release/.venv/bin/python" \
            .artifacts/release-requirements.txt
          sudo "$broker_uv" pip install \
            --python "$broker_release/.venv/bin/python" \
            --no-deps "$broker_release/dist/rtsp_proxy-0.1.0-py3-none-any.whl"
          sudo chown -R root:root "$broker_release"
          sudo chmod -R go-w "$broker_release"
          sudo ln -s releases/probe-contract /opt/rtsp-proxy/current
          sudo install -d -o root -g root -m 0755 /etc/rtsp-proxy
          sudo install -d -o root -g root -m 0755 \
            /run/rtsp-proxy-probe-contract
          sudo install -o root -g root -m 0755 \
            tests/fixtures/probe_broker_client.py \
            /run/rtsp-proxy-probe-contract/client.py
          sudo install -o root -g root -m 0600 \
            tests/fixtures/probe-broker.env /etc/rtsp-proxy/probe-broker.env
          sudo install -d -o root -g root -m 0700 \
            /sys/fs/bpf/rtsp-proxy-probe-broker
          sudo install -o root -g root -m 0644 \
            deploy/systemd/rtsp-proxy-probe-broker.socket \
            /run/systemd/system/rtsp-proxy-probe-broker.socket
          sudo install -o root -g root -m 0644 \
            deploy/systemd/rtsp-proxy-probe-broker.service \
            /run/systemd/system/rtsp-proxy-probe-broker.service
          sudo systemctl daemon-reload
          sudo systemd-analyze verify \
            /run/systemd/system/rtsp-proxy-probe-broker.socket \
            /run/systemd/system/rtsp-proxy-probe-broker.service
          sudo systemctl start rtsp-proxy-probe-broker.socket
          sudo env \
            RTSP_PROXY_RUN_PROBE_BROKER_CONTRACT=1 \
            RTSP_PROXY_BPFTOOL="$broker_bpftool" \
            RTSP_PROXY_PROBE_BROKER_CLIENT=/run/rtsp-proxy-probe-contract/client.py \
            "$PWD/.venv/bin/python" -m pytest -q -p no:cacheprovider \
            tests/contract/test_probe_broker_service.py
          sudo systemctl is-active --quiet rtsp-proxy-probe-broker.service
          test -z "$(sudo find /sys/fs/bpf/rtsp-proxy-probe-broker \
            -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -z "$(sudo find /run/rtsp-proxy-probe-broker/guard-ownership \
            -mindepth 1 -maxdepth 1 -name '*.json' -print -quit)"

      - name: Verify effective listener contract
        env:
          MEDIAMTX_BINARY: .artifacts/mediamtx/mediamtx
          FFMPEG_BINARY: .artifacts/ffmpeg/bin/ffmpeg
          FFPROBE_BINARY: .artifacts/ffmpeg/bin/ffprobe
        run: uv run pytest -m contract tests/contract

  pull-load-generator-contract:
    name: pull-load-generator-contract (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install native GStreamer build and runtime packages
        run: |
          sudo apt-get -o Acquire::Retries=10 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=10 -o Acquire::https::Timeout=30 \
            install --yes --no-install-recommends \
            iproute2 \
            libgstrtspserver-1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad

      - name: Download and verify FFmpeg/ffprobe (${{ matrix.arch }})
        run: |
          archive_url=$(jq --raw-output --arg arch "${{ matrix.arch }}" '.ffmpeg.architectures[$arch].archive_url' deploy/artifact-catalog.json)
          archive_sha256=$(jq --raw-output --arg arch "${{ matrix.arch }}" '.ffmpeg.architectures[$arch].archive_sha256' deploy/artifact-catalog.json)
          ffmpeg_sha256=$(jq --raw-output --arg arch "${{ matrix.arch }}" '.ffmpeg.architectures[$arch].ffmpeg_sha256' deploy/artifact-catalog.json)
          ffprobe_sha256=$(jq --raw-output --arg arch "${{ matrix.arch }}" '.ffmpeg.architectures[$arch].ffprobe_sha256' deploy/artifact-catalog.json)
          mkdir -p .artifacts/ffmpeg
          curl --fail --location --silent --show-error \
            --output .artifacts/ffmpeg.tar.xz \
            "$archive_url"
          echo "$archive_sha256  .artifacts/ffmpeg.tar.xz" | sha256sum --check
          tar -xJf .artifacts/ffmpeg.tar.xz -C .artifacts/ffmpeg --strip-components=1
          echo "$ffmpeg_sha256  .artifacts/ffmpeg/bin/ffmpeg" | sha256sum --check
          echo "$ffprobe_sha256  .artifacts/ffmpeg/bin/ffprobe" | sha256sum --check

      - name: Build and stage pinned patched MediaMTX (${{ matrix.arch }})
        run: |
          binary_sha256=$(jq --raw-output --arg arch "${{ matrix.arch }}" '.mediamtx.architectures[$arch].binary_sha256' deploy/artifact-catalog.json)
          mkdir -p .artifacts/mediamtx
          tools/build_mediamtx.sh "${{ matrix.arch }}" .artifacts/mediamtx/mediamtx
          sudo install -d /opt/rtsp-proxy/releases/native-contract/bin
          sudo install -m 0755 .artifacts/mediamtx/mediamtx /opt/rtsp-proxy/releases/native-contract/bin/mediamtx
          echo "$binary_sha256  /opt/rtsp-proxy/releases/native-contract/bin/mediamtx" | sha256sum --check

      - name: Build native GStreamer load binaries
        run: |
          gst-launch-1.0 --version
          dpkg-query --show --showformat='${Package}=${Version}\n' \
            libgstrtspserver-1.0-dev gstreamer1.0-tools \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad
          make -C tools/load
          sha256sum tools/load/rtsp-pull-server tools/load/rtsp-load-reader

      - name: Capture and bind native Linux runtime manifest (${{ matrix.arch }})
        env:
          RTSP_RUNTIME_NATIVE: "1"
        run: uv run pytest tests/contract/test_runtime_manifest.py -q

      - name: Verify scoped Linux ingress netem contract (${{ matrix.arch }})
        run: |
          sudo env \
            RTSP_NETEM_NATIVE=1 \
            PATH="$PATH" \
            PYTHONPATH="$PWD/src:$PWD" \
            "$PWD/.venv/bin/python" -m pytest tests/contract/test_netem.py -q

      - name: Verify H264/H265 independent pull endpoints over RTSP/TCP
        env:
          RTSP_PULL_SERVER_BINARY: tools/load/rtsp-pull-server
          RTSP_LOAD_READER_BINARY: tools/load/rtsp-load-reader
          FFMPEG_BINARY: .artifacts/ffmpeg/bin/ffmpeg
          FFPROBE_BINARY: .artifacts/ffmpeg/bin/ffprobe
        run: uv run pytest tests/contract/test_rtsp_pull_generator.py

      - name: Verify Phase D two-node administration and RTP isolation
        run: |
          sudo install -m 0644 deploy/systemd/rtsp-proxy-media@.service /etc/systemd/system/
          sudo install -m 0644 deploy/systemd/rtsp-proxy-nftables.service /etc/systemd/system/
          sudo install -d -m 0755 /opt/rtsp-proxy/releases/native-contract/.venv/bin
          sudo install -m 0755 /usr/bin/true \
            /opt/rtsp-proxy/releases/native-contract/.venv/bin/rtsp-proxy-nft-reconcile
          if [ ! -e /opt/rtsp-proxy/current ]; then
            sudo ln -s releases/native-contract /opt/rtsp-proxy/current
          fi
          sudo systemctl daemon-reload
          sudo systemd-analyze verify \
            /etc/systemd/system/rtsp-proxy-nftables.service \
            /etc/systemd/system/rtsp-proxy-media@.service
          sudo systemctl start rtsp-proxy-nftables.service
          sudo env \
            MEDIAMTX_BINARY="/opt/rtsp-proxy/releases/native-contract/bin/mediamtx" \
            RTSP_PULL_SERVER_BINARY="$PWD/tools/load/rtsp-pull-server" \
            RTSP_LOAD_READER_BINARY="$PWD/tools/load/rtsp-load-reader" \
            FFMPEG_BINARY="$PWD/.artifacts/ffmpeg/bin/ffmpeg" \
            PATH="$PATH" \
            "$PWD/.venv/bin/python" -m pytest tests/contract/test_node_isolation.py -q
